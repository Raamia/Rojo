services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rojo
      POSTGRES_PASSWORD: rojo
      POSTGRES_DB: rojo
    ports:
      - "5432:5432"
    volumes:
      - rojo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rojo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rojo_postgres:
