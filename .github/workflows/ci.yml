name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain cannot drift from what the code
          # declares. Rojo also runs `go test` as a subprocess during
          # verification, so this is the toolchain jobs get, not just the one
          # that compiles the server.
          go-version-file: go.mod
          cache: true

      # The integration tests create real git worktrees and commit to them, and
      # git refuses to commit without an identity.
      - name: Configure git for worktree tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race is the point of running tests here: the queue, worker pool, event
      # bus and fan-out are all concurrent, and a data race is exactly the class
      # of bug that passes locally and fails in production.
      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Reachability-based, so it reports vulnerabilities in code this module
      # actually calls rather than everything in the dependency graph.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: this checks the image still assembles, which
      # breaks silently otherwise since nothing else compiles the Dockerfile.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
